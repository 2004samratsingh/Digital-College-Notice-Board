<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Character set encoding for the document -->
    <meta charset="UTF-8">
    <!-- Responsive viewport settings for mobile and desktop screens -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title displayed on the browser tab -->
    <title>Digital College Notice Board</title>
    <!-- Link to the external CSS file for styling -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main wrapper container holding the entire application layout -->
    <div class="board-container">
        
        <!-- Header section containing the college name and portal title -->
        <header>
            <h1>Digital College Notice Board</h1>
            <p>Awadhut Bhagwan Ram PG College - Live Updates</p>
        </header>

        <!-- Form section for posting new notices (Admin / CR interface) -->
        <section class="form-section">
            <h2>Post New Notice</h2>
            <form id="notice-form">
                <!-- Input field for notice headline/title -->
                <input type="text" id="notice-title" placeholder="Notice Title (e.g., Exam Schedule)" required>
                <!-- Textarea for detailed notice description -->
                <textarea id="notice-desc" placeholder="Write notice details here..." rows="3" required></textarea>
                <!-- Submit button to publish the notice -->
                <button type="submit">Publish Notice</button>
            </form>
        </section>

        <!-- Section displaying the list of published notices -->
        <section class="notices-section">
            <h2>Recent Notices</h2>
            <!-- Container where JavaScript dynamically appends notice cards -->
            <div id="notice-list"></div>
        </section>

    </div>

    <!-- Link to the external JavaScript file for application logic -->
    <script src="script.js"></script>
</body>
</html>
